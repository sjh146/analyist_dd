strategies:
  theme_trading:
    name: "테마주 매매"
    description: "벡터 유사도로 테마 그룹을 찾아 리더 추종 매매"
    parameters:
      vector_similarity_threshold: 0.75
      min_group_size: 3
      max_group_size: 15
      rebalance_days: 5
      position_size_pct: 0.15
      stop_loss_pct: 0.07
      take_profit_pct: 0.15

  cycle_rotation:
    name: "사이클 순환 매매"
    description: "업종별 사이클에 따라 순환 매매"
    parameters:
      lookback_days: 60
      cycle_detection_window: 20
      rotation_threshold: 0.1
      min_momentum: 0.05
      max_sector_exposure: 0.30
      position_size_pct: 0.10

  twin_trading:
    name: "쌍둥이 매매"
    description: "상관관계 높은 종목쌍의 가격 차이를 이용한 수렴/발산 매매"
    parameters:
      min_correlation: 0.80
      correlation_period: 60
      divergence_threshold: 0.05
      convergence_threshold: 0.01
      zscore_entry: 2.0
      zscore_exit: 0.5
      position_size_pct: 0.08

  # ── 팩터 전략 (강환국『하면 된다! 퀀트투자』) ──────────────────────────
  # 임계값(상위 N, rebalance, Z-score 등)은 코드 상수로 하드코딩 — 과최적화 방지.
  # DB 파라미터에는 paper_only(실매매 방지)만 저장. is_active=true로 활성화.
  value_factor:
    name: "가치주 매매"
    description: "저PER/저PBR/저PSR 랭크 상위 30종목 동일가중 (팩터)"
    is_active: true
    parameters:
      paper_only: true

  quality_factor:
    name: "퀄리티 매매"
    description: "ROE 평균·GP/A·이익안정성 랭크 상위 30종목 동일가중 (팩터)"
    is_active: true
    parameters:
      paper_only: true

  momentum_factor:
    name: "모멘텀 매매"
    description: "12-1·3-6·52주 최고가 근접 모멘텀 랭크 상위 30종목 동일가중 (팩터)"
    is_active: true
    parameters:
      paper_only: true

  lowvol_factor:
    name: "저변동 매매"
    description: "저변동성·저베타 랭크 상위 30종목 동일가중, long-only (팩터)"
    is_active: true
    parameters:
      paper_only: true

  multifactor:
    name: "멀티팩터 매매"
    description: "가치·퀄리티·모멘텀·저변동 Z-score 동일가중 합산 상위 20종목 (팩터)"
    is_active: true
    parameters:
      paper_only: true
