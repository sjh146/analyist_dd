# postgres-exporter 커스텀 쿼리 — DB 신호 특이점 감시 (data quality signals)
# 메트릭명 = <쿼리키>_<metric키> (extend.query-path 방식, pg prefix 없음)
# 스크랩 15초 부담이 없도록 각 쿼리를 최근 20거래일/최신 스냅샷으로 제한한다.
# 주의: DISTINCT trade_date 는 window 함수보다 먼저 적용되어야 함(서브쿼리로 분리).

market_data_freshness:
  query: |
    SELECT (CURRENT_DATE - MAX(trade_date))::float AS days
    FROM market_data
  metrics:
    - days:
        usage: "GAUGE"
        description: "마지막 market_data trade_date 로부터 경과 일수"

# 뉴스 분석 파이프라인 정지/저장 실패 감지.
# WHY(실측 2026-09-25): news_analysis 에 url 유니크 제약이 없어 앱의 ON CONFLICT (url) 이 매번
# 거부됐고, **2일간 분석 결과가 전부 폐기**(24h 3,657건)됐는데도 아무 메트릭이 없어 로그를 grep 하기
# 전엔 아무도 몰랐다. 신선도와 최근 저장량을 함께 노출해 "돌지만 저장이 안 되는" 상태를 잡는다.
news_analysis_freshness:
  query: |
    SELECT
      (EXTRACT(EPOCH FROM (now() - MAX(analyzed_at))) / 3600.0)::float AS hours,
      COUNT(*) FILTER (WHERE analyzed_at > now() - INTERVAL '24 hours')::float AS rows_24h
    FROM news_analysis
  metrics:
    - hours:
        usage: "GAUGE"
        description: "마지막 뉴스 분석 저장 이후 경과 시간 (앱은 30분 주기로 돈다)"
    - rows_24h:
        usage: "GAUGE"
        description: "최근 24시간 저장된 뉴스 분석 행수 (0 이면 저장 실패 의심)"

market_data_rows:
  query: |
    WITH d AS (
      SELECT trade_date, row_number() OVER (ORDER BY trade_date DESC) AS rn
      FROM (SELECT DISTINCT trade_date FROM market_data) t
    )
    SELECT v."window" AS "window", COUNT(*)::float AS recent
    FROM (VALUES ('1d', 1), ('5d', 5), ('20d', 20)) AS v("window", n)
    JOIN d ON d.rn <= v.n
    JOIN market_data m ON m.trade_date = d.trade_date
    GROUP BY v."window", v.n
    ORDER BY v.n
  metrics:
    - window:
        usage: "LABEL"
        description: "최근 거래일 창 (1d/5d/20d, 누적)"
    - recent:
        usage: "GAUGE"
        description: "최근 창의 market_data 행수"

market_data_zero_volume:
  query: |
    WITH d AS (
      SELECT trade_date, row_number() OVER (ORDER BY trade_date DESC) AS rn
      FROM (SELECT DISTINCT trade_date FROM market_data) t
    )
    SELECT (COUNT(*) FILTER (WHERE m.volume = 0)::float
            / NULLIF(COUNT(*), 0)) AS ratio_20d
    FROM market_data m
    JOIN d ON m.trade_date = d.trade_date
    WHERE d.rn <= 20
  metrics:
    - ratio_20d:
        usage: "GAUGE"
        description: "최근 20거래일 거래량 0 비율"

market_data_frozen:
  query: |
    WITH d AS (
      SELECT trade_date, row_number() OVER (ORDER BY trade_date DESC) AS rn
      FROM (SELECT DISTINCT trade_date FROM market_data) t
    ),
    win AS (
      SELECT m.stock_code, m.trade_date, m.open_price, m.high_price,
             m.low_price, m.close_price, m.volume, d.rn
      FROM market_data m
      JOIN d ON m.trade_date = d.trade_date
      WHERE d.rn <= 21
    ),
    pairs AS (
      SELECT stock_code, trade_date, rn,
             open_price, high_price, low_price, close_price, volume,
             lag(open_price)  OVER w AS po,
             lag(high_price)  OVER w AS ph,
             lag(low_price)   OVER w AS pl,
             lag(close_price) OVER w AS pc,
             lag(volume)      OVER w AS pv
      FROM win
      WINDOW w AS (PARTITION BY stock_code ORDER BY trade_date)
    )
    SELECT (COUNT(*) FILTER (
              WHERE rn <= 20 AND po IS NOT NULL
                AND po = open_price AND ph = high_price AND pl = low_price
                AND pc = close_price AND pv = volume
            )::float / NULLIF(COUNT(*) FILTER (WHERE rn <= 20 AND po IS NOT NULL), 0)) AS ratio_20d
    FROM pairs
  metrics:
    - ratio_20d:
        usage: "GAUGE"
        description: "직전 거래일 대비 OHLC+거래량 완전 동일(동결) 비율 (최근 20거래일)"

pipeline_table:
  query: |
    SELECT 'news_analysis' AS "table", COUNT(*)::float AS rows FROM news_analysis
    UNION ALL SELECT 'news_events', COUNT(*)::float FROM news_events
    UNION ALL SELECT 'sns_posts', COUNT(*)::float FROM sns_posts
    UNION ALL SELECT 'sns_post_features', COUNT(*)::float FROM sns_post_features
    UNION ALL SELECT 'foreign_institutional', COUNT(*)::float FROM foreign_institutional
    UNION ALL SELECT 'krx_trading', COUNT(*)::float FROM krx_trading
    UNION ALL SELECT 'krx_short_selling', COUNT(*)::float FROM krx_short_selling
    UNION ALL SELECT 'minute_bars', COUNT(*)::float FROM minute_bars
    UNION ALL SELECT 'stock_vectors', COUNT(*)::float FROM stock_vectors
    UNION ALL SELECT 'financial_statements', COUNT(*)::float FROM financial_statements
    UNION ALL SELECT 'stock_sentiment', COUNT(*)::float FROM stock_sentiment
  metrics:
    - table:
        usage: "LABEL"
        description: "파이프라인 테이블명"
    - rows:
        usage: "GAUGE"
        description: "파이프라인 테이블 행수"

strategy_run:
  query: |
    SELECT DISTINCT ON (tool) tool, auc
    FROM strategy_runs
    WHERE auc IS NOT NULL
    ORDER BY tool, run_at DESC
  metrics:
    - tool:
        usage: "LABEL"
        description: "전략 도구명"
    - auc:
        usage: "GAUGE"
        description: "tool별 최근 AUC"

feature:
  # ⚠ 배치 필터 제거 (실측 2026-09-25 20:22) — dq_feature 와 **같은 버그**였다.
  #   computed_at = MAX(computed_at) 는 "마지막 배치"만 세므로, R10 빌더가 19개 피처를
  #   갱신한 뒤 alive/dead 가 76/97 → **16/3** 으로 바뀌었다(실제 데이터는 그대로).
  #   이 메트릭은 리서처 북극성("살아있는 피처 ≥ 죽은 피처")의 근거라, 부분집합으로
  #   낙관적으로 보이는 것이 특히 위험하다. → 전체 테이블(현재상태)을 센다.
  query: |
    SELECT COUNT(*) FILTER (WHERE nonzero_ratio = 0)::float AS dead_count,
           COUNT(*) FILTER (WHERE nonzero_ratio > 0)::float AS alive_count
    FROM feature_coverage
  metrics:
    - dead_count:
        usage: "GAUGE"
        description: "죽은 피처(=nonzero_ratio 0) 수"
    - alive_count:
        usage: "GAUGE"
        description: "살아있는 피처(nonzero_ratio > 0) 수"

pg_idle_in_transaction:
  query: |
    SELECT COALESCE(EXTRACT(EPOCH FROM (now() - max(state_change))), 0)::float AS max_seconds,
           count(*)::float AS count
    FROM pg_stat_activity
    WHERE datname = 'stock_trading' AND state = 'idle in transaction'
  metrics:
    - max_seconds:
        usage: "GAUGE"
        description: "최장 idle-in-transaction 경과 시간(초)"
    - count:
        usage: "GAUGE"
        description: "idle-in-transaction 커넥션 개수"

pg_longest_transaction:
  query: |
    SELECT COALESCE(EXTRACT(EPOCH FROM (now() - max(xact_start))), 0)::float AS seconds
    FROM pg_stat_activity
    WHERE datname = 'stock_trading' AND xact_start IS NOT NULL
  metrics:
    - seconds:
        usage: "GAUGE"
        description: "최장 진행 중 트랜잭션 경과 시간(초)"

pg_idle_in_transaction_by_client:
  query: |
    SELECT COALESCE(client_addr::text, 'local') AS client,
           count(*)::float AS count
    FROM pg_stat_activity
    WHERE datname = 'stock_trading' AND state = 'idle in transaction'
    GROUP BY client_addr
  metrics:
    - client:
        usage: "LABEL"
        description: "클라이언트 IP (local = unix socket)"
    - count:
        usage: "GAUGE"
        description: "클라이언트별 idle-in-transaction 커넥션 개수"

# ─────────────────────────────────────────────────────────────────────────────
# 정확성 메트릭 (2026-09-25 추가) — "행도 값도 있는데 틀린" 실패 유형 전용.
# 기존 신선도/0비율/동결 지표로는 아래 5가지를 잡지 못해 실측으로 발견하기까지
# 오래 걸렸다: 커버리지 착시(NaN≠0), as-of 위반, 종목 상수 피처, 시장레벨 피처,
# 상장 전 패딩, 러너 자기신고 불일치.
# ─────────────────────────────────────────────────────────────────────────────

# ① 컬럼 단위 결측/커버리지 — 수집이 통째로 비었는데 0 으로 보이는 경우를 잡는다.
#    (SQL 은 `col <> 0` 에서 NULL 을 자동 제외하므로 pandas/numpy 착시는 여기 없다.
#     그 착시는 feature_coverage 쪽 _naive/_honest 쌍으로 잡는다.)
dq_col_quality:
  query: |
    SELECT 'foreign_institutional' AS "table", 'foreign_net_buy' AS "column",
           (COUNT(*) FILTER (WHERE foreign_net_buy IS NULL))::float / NULLIF(COUNT(*),0) AS null_ratio,
           (COUNT(*) FILTER (WHERE foreign_net_buy IS NOT NULL AND foreign_net_buy <> 0))::float / NULLIF(COUNT(*),0) AS nonzero_ratio
    FROM foreign_institutional
    UNION ALL
    SELECT 'foreign_institutional', 'institution_net_buy',
           (COUNT(*) FILTER (WHERE institution_net_buy IS NULL))::float / NULLIF(COUNT(*),0),
           (COUNT(*) FILTER (WHERE institution_net_buy IS NOT NULL AND institution_net_buy <> 0))::float / NULLIF(COUNT(*),0)
    FROM foreign_institutional
    UNION ALL
    SELECT 'ownership', 'foreign_ownership_pct',
           (COUNT(*) FILTER (WHERE foreign_ownership_pct IS NULL))::float / NULLIF(COUNT(*),0),
           (COUNT(*) FILTER (WHERE foreign_ownership_pct IS NOT NULL AND foreign_ownership_pct <> 0))::float / NULLIF(COUNT(*),0)
    FROM ownership
    UNION ALL
    SELECT 'ownership', 'institution_ownership_pct',
           (COUNT(*) FILTER (WHERE institution_ownership_pct IS NULL))::float / NULLIF(COUNT(*),0),
           (COUNT(*) FILTER (WHERE institution_ownership_pct IS NOT NULL AND institution_ownership_pct <> 0))::float / NULLIF(COUNT(*),0)
    FROM ownership
    UNION ALL
    SELECT 'financial_statements', 'net_income',
           (COUNT(*) FILTER (WHERE net_income IS NULL))::float / NULLIF(COUNT(*),0),
           (COUNT(*) FILTER (WHERE net_income IS NOT NULL AND net_income <> 0))::float / NULLIF(COUNT(*),0)
    FROM financial_statements
  metrics:
    - table:
        usage: "LABEL"
        description: "감시 테이블"
    - column:
        usage: "LABEL"
        description: "감시 컬럼"
    - null_ratio:
        usage: "GAUGE"
        description: "결측 비율 (0으로 채우면 사라지는 신호)"
    - nonzero_ratio:
        usage: "GAUGE"
        description: "정직한 비영 비율 (NULL 제외)"

# ② 상장 전 all-zero 패딩 — 종목의 첫 시세일보다 이른 수급 행.
dq_padding:
  query: |
    WITH m AS (
      SELECT stock_code, MIN(trade_date) AS first_mkt FROM market_data GROUP BY stock_code
    )
    SELECT COUNT(*) FILTER (WHERE fi.trade_date < m.first_mkt)::float AS rows_before_listing,
           COUNT(*)::float AS total_rows,
           (COUNT(*) FILTER (WHERE fi.trade_date < m.first_mkt))::float / NULLIF(COUNT(*),0) AS ratio
    FROM foreign_institutional fi
    JOIN m ON m.stock_code = fi.stock_code
  metrics:
    - rows_before_listing:
        usage: "GAUGE"
        description: "상장 전 구간에 적재된 수급 행수(패딩)"
    - total_rows:
        usage: "GAUGE"
        description: "수급 총 행수(분모)"
    - ratio:
        usage: "GAUGE"
        description: "패딩 비율"

# ③ as-of 위반 — 미래 날짜 / 존재하지 않는 거래일 / 미래 보고서.
dq_asof_violation:
  query: |
    WITH mx AS (SELECT MAX(trade_date) AS maxd FROM market_data)
    SELECT 'supply_future_dated' AS scope, COUNT(*)::float AS rows
    FROM foreign_institutional fi, mx WHERE fi.trade_date > mx.maxd
    UNION ALL
    SELECT 'supply_phantom_day', COUNT(*)::float
    FROM foreign_institutional fi
    WHERE NOT EXISTS (
      SELECT 1 FROM market_data m
      WHERE m.stock_code = fi.stock_code AND m.trade_date = fi.trade_date
    )
    UNION ALL
    SELECT 'ownership_future_dated', COUNT(*)::float
    FROM ownership o, mx WHERE o.trade_date > mx.maxd
    UNION ALL
    SELECT 'financial_report_future', COUNT(*)::float
    FROM financial_statements WHERE report_date > CURRENT_DATE
  metrics:
    - scope:
        usage: "LABEL"
        description: "위반 종류"
    - rows:
        usage: "GAUGE"
        description: "위반 행수 (0 이어야 정상)"

# ④ 러너 자기신고 vs 실제 적재량 — 확장 러너가 +0행으로 성공 종료한 유형.
dq_claim:
  query: |
    SELECT DISTINCT ON (runner, table_name)
           runner,
           table_name AS "table",
           COALESCE(source_rows, 0)::float AS source,
           claimed_rows::float AS stored,
           COALESCE(persisted_rows, 0)::float AS new_rows,
           (claimed_rows - COALESCE(persisted_rows, claimed_rows))::float AS gap,
           CASE WHEN claimed_rows = 0 AND COALESCE(source_rows, 0) > 0
                THEN 1.0 ELSE 0.0 END AS parse_failure,
           CASE WHEN claimed_rows = 0 THEN 1.0 ELSE 0.0 END AS zero_stored
    FROM dq_runner_claim
    ORDER BY runner, table_name, run_at DESC
  metrics:
    - runner:
        usage: "LABEL"
        description: "자기신고한 러너 이름"
    - table:
        usage: "LABEL"
        description: "신고 대상 테이블"
    - source:
        usage: "GAUGE"
        description: "소스 API 가 준 행수"
    - stored:
        usage: "GAUGE"
        description: "로더가 저장했다고 보고한 행수(upsert 중복 포함)"
    - new_rows:
        usage: "GAUGE"
        description: "실제 신규 적재 행수(테이블 델타)"
    - gap:
        usage: "GAUGE"
        description: "stored - new_rows (같은 구간 재수집이면 >0 이 정상 — 알림 대상 아님)"
    - parse_failure:
        usage: "GAUGE"
        description: "1 = 소스는 행을 줬는데 저장이 0 (진짜 실패 — 2026-09-24 파서 키 불일치 유형)"
    - zero_stored:
        usage: "GAUGE"
        description: "1 = 저장 0 신고(이력 소진일 수 있어 단독으로는 알림하지 않음)"

# ⑤ 피처 정확성 — 커버리지 착시/결측/종목상수/시장레벨.
#    주의: dead 피처(전부 0/결측)는 정의상 "종목 상수"이자 "시장레벨"이므로 분모에서 제외한다.
#    죽은 피처는 feature_dead_count 가 따로 세고, 여기서는 **살아있는데 무변별인** 피처만
#    문제 삼는다(2026-09-24 실측: net_income/roe/quality_roa 등이 살아있는데 종목 상수였다).
dq_feature:
  # ⚠ 배치 필터(`computed_at = MAX(computed_at)`)를 **제거했다** (실측 2026-09-25 20:20).
  #   WHY: feature_coverage 는 feature_name 이 PK 인 **현재상태 테이블**이다(피처당 1행,
  #   computed_at 은 "그 피처를 마지막으로 측정한 시각"). 그래서 MAX(computed_at) 는
  #   "마지막 배치"가 되고, 부분 재계산이 일어나면 **전역 DQ 판정이 그 부분집합으로 갈아탄다**.
  #   실측: R10 빌더(build_supply_market_features.py)가 19개 피처 행을 20:08 에 갱신하자
  #   stock_constant_ratio 0.3816→0.625, coverage_illusion_max 0.00024→1.0, null_ratio_max
  #   0.00024→1.0 으로 **3분 만에** 뒤집혔다(데이터는 그대로인데 판정만 바뀜).
  #   더 나쁜 방향도 있다: 부분 배치만 보면 나머지 180개 피처의 결함이 **안 보인다**.
  #   → 전체 테이블(현재상태)을 본다. 살아있는 피처만 분모/대상으로 삼는다(스킬 규칙:
  #     dead 피처는 정의상 상수·전량결측이라 넣으면 상시 오탐).
  query: |
    SELECT
      (COUNT(*) FILTER (WHERE stock_unique_median <= 1 AND nonzero_ratio > 0))::float
        / NULLIF(COUNT(*) FILTER (WHERE nonzero_ratio > 0), 0) AS stock_constant_ratio,
      COUNT(*) FILTER (WHERE cross_section_constant_ratio >= 0.99 AND nonzero_ratio > 0)::float
        AS market_level_count,
      -- MAX 형태는 **정보용**이다(알림 대상 아님): 최악 피처 하나가 분모를 지배해
      -- 실측 기준선이 0.9998 이다(R10 의 near-empty 피처). 임계값을 둘 수 없다.
      COALESCE(MAX(nonzero_ratio_naive - nonzero_ratio_honest) FILTER (WHERE nonzero_ratio > 0), 0)::float
        AS coverage_illusion_max,
      COALESCE(MAX(null_ratio) FILTER (WHERE nonzero_ratio > 0), 0)::float AS null_ratio_max,
      -- 개수 형태는 **알림 대상**이다: 하나의 최악값이 아니라 "몇 개가 결함인가"를 세므로
      -- MAX 보다 안정적이지만 **측정 인구에 비례**한다 — 인구가 180 → 199개로 늘자
      -- 착시>0.10 이 15 → 36개로 늘었다(2026-09-25 21:17, 배치별 R10 15 / R11 2 / R12 19).
      -- 이벤트 배치(17개)는 갱신 후 착시 0 이다(naive=honest, NULL 없이 격자 채움).
      COUNT(*) FILTER (WHERE nonzero_ratio_naive - nonzero_ratio_honest > 0.10)::float
        AS coverage_illusion_count,
      COUNT(*) FILTER (WHERE null_ratio > 0.90 AND nonzero_ratio > 0)::float
        AS null_ratio_high_count,
      -- 신선도/커버리지 규모 — R14(스냅샷 정체) 감시용. computed_at 이 피처별이므로
      -- "가장 오래된 피처가 언제 측정됐는가"가 진짜 신선도다.
      COUNT(*)::float AS feature_count,
      (EXTRACT(EPOCH FROM (now() - MIN(computed_at))) / 86400.0)::float AS oldest_age_days
    FROM feature_coverage
  metrics:
    - stock_constant_ratio:
        usage: "GAUGE"
        description: "종목 상수 피처 비율(종목별 유니크값 중앙값<=1) — 룩어헤드 의심"
    - market_level_count:
        usage: "GAUGE"
        description: "날짜 내 분산 0(시장레벨) 피처 수 — 횡단면 무변별"
    - coverage_illusion_max:
        usage: "GAUGE"
        description: "커버리지 착시 최대값 (naive - honest) — 정보용, 최악 피처가 분모를 지배"
    - null_ratio_max:
        usage: "GAUGE"
        description: "피처 최대 결측 비율 — 정보용"
    - coverage_illusion_count:
        usage: "GAUGE"
        description: "커버리지 착시 >0.10 인 피처 개수 — 알림 대상(기준선 36, 측정 인구에 비례)"
