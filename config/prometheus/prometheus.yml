global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alert.rules.yml"
  - "alert.dq.rules.yml"

scrape_configs:
  - job_name: 'api-gateway'
    static_configs:
      - targets: ['api-gateway:9100']

  - job_name: 'news-analyzer'
    static_configs:
      - targets: ['news-analyzer:9101']

  - job_name: 'xgboost-ml'
    static_configs:
      - targets: ['xgboost-ml:9102']

  - job_name: 'strategy-agents'
    static_configs:
      - targets: ['strategy-agents:9103']

  # ⚠ postgres 잡은 **자체 인터벌/타임아웃**을 쓴다 (실측 2026-09-25 20:03).
  #   WHY: 기본 scrape_timeout 10s 인데 postgres-exporter 의 /metrics 는 DB 부하 시
  #   **12.7초**(pg_exporter_last_scrape_duration_seconds=12.71, wall 13.4s)가 걸린다.
  #   → 매 스크랩이 "context deadline exceeded" 로 실패해 dq_* 51개 + market_data_* 전부
  #     Prometheus 에서 **통째로 사라진다**. 그러면 dq_snapshot 이 전 메트릭을 nodata 로
  #     기록하고 rc=0 을 반환해 "모니터링 사각지대"가 "정상"으로 보고된다.
  #   DQ 메트릭은 분 단위로 변하지 않으므로 60s 인터벌로도 충분하고, 타임아웃 여유가 크다.
  #   부수 효과로 exporter 가 DB 에 쓰는 부하가 4배 줄어든다(스크랩당 ~13초 × 4회/분 → 1회/분).
  - job_name: 'postgres'
    scrape_interval: 60s
    scrape_timeout: 45s
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']

  # neo4j: CE는 Prometheus 메트릭 엔드포인트 미지원(Enterprise 전용).
  # 가용성은 docker healthcheck(7474 HTTP)로 모니터링하며, Prometheus 스크랩은 제외.
