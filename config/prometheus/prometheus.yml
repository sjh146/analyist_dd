global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'api-gateway'
    static_configs:
      - targets: ['api-gateway:9100']

  - job_name: 'news-analyzer'
    static_configs:
      - targets: ['news-analyzer:9101']

  - job_name: 'xgboost-ml'
    static_configs:
      - targets: ['xgboost-ml:9102']

  - job_name: 'strategy-agents'
    static_configs:
      - targets: ['strategy-agents:9103']

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']

  # neo4j: CE는 Prometheus 메트릭 엔드포인트 미지원(Enterprise 전용).
  # 가용성은 docker healthcheck(7474 HTTP)로 모니터링하며, Prometheus 스크랩은 제외.
