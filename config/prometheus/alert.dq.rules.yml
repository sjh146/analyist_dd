# 데이터 정확성 알림 (2026-09-25 신설)
#
# WHY: 기존 db_data_quality 규칙은 "행이 없다"(신선도/행수 급감/0거래량/동결/dead feature)
# 유형만 잡았다. 2026-09-24 실측에서 실제로 모델을 망친 것은 **행도 값도 있는데 틀린**
# 유형 6가지였고, 이들은 조용히 지나갔다. 이 그룹이 그 6가지를 실행 가능한 알림으로 만든다.
#  ① 커버리지 착시(pandas `col != 0` 이 NaN 을 True 로 셈) → CoverageIllusion
#  ② as-of 위반(미래 날짜·유령 거래일·미래 보고서) → AsofViolationFound
#  ③ 종목 상수 피처 과다(룩어헤드 의심) → FeatureStockConstantHigh
#  ④ 시장레벨(날짜 내 분산 0) 피처 과다 → FeatureMarketLevelMany
#  ⑤ 상장 전 all-zero 패딩 행 → SupplyPaddingFound
#  ⑥ 러너 자기신고 ≠ 실제 적재량 → RunnerClaimGap
groups:
  # ── 모니터링 사각지대 (2026-09-25 신설) ─────────────────────────────────────
  # WHY: 이 그룹이 없어서 4시간을 눈 먼 채로 지났다(실측 2026-09-25 15:50~20:03).
  #   postgres-exporter /metrics 가 DB 부하 시 12.7초 걸리는데 Prometheus 기본
  #   scrape_timeout 이 10초여서 **매 스크랩이 실패** → dq_* 51개가 전부 사라졌다.
  #   그런데 ① 타겟 다운(up==0)을 잡는 규칙이 없었고 ② Prometheus 에 alerting 섹션이
  #   없어(Alertmanager 부재) 기존 17개 규칙도 아무 데도 발송되지 않았다.
  #   → "데이터가 이상하다"가 아니라 "데이터를 보고 있지 않다"를 잡는 규칙을 따로 둔다.
  - name: dq_monitoring_blindness
    rules:
      - alert: PostgresExporterDown
        # DQ 메트릭 51개의 유일한 공급원. 이게 0 이면 모든 DQ 판정이 무의미하다.
        expr: up{job="postgres"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "postgres-exporter 다운(up=0) — DQ 메트릭 51개 전부 공급 중단"

      - alert: DQMetricsAbsent
        # 스크랩은 up 이어도 메트릭이 통째로 없을 수 있다(쿼리 실패). 기준선: 정상 스냅샷
        # 21개에서 market_data_freshness_days 는 21/21 존재했다. absent 는 "정상 상태값"이
        # 없으므로 오탐이 원리적으로 불가능하다.
        expr: absent(market_data_freshness_days)
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "DQ 핵심 메트릭 소실 — 15분간 market_data_freshness_days 미수집(모니터링 실명)"

      - alert: PostgresExporterScrapeSlow
        # 스크랩이 타임아웃(45s)에 닿기 **전에** 경고한다 — 사후가 아니라 사전 감지.
        # 기준선 실측: 부하 시 12.7초 / 현재 8.0초. 25초는 기준선의 2배라 상시 오탐이 아니고,
        # 타임아웃 45초까지 여유가 있어 "곧 실명한다"를 미리 알린다.
        expr: pg_exporter_last_scrape_duration_seconds > 25
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "postgres-exporter 스크랩 {{ $value }}초 — 타임아웃 45초 접근 중(DQ 실명 위험)"

  - name: dq_accuracy
    rules:
      - alert: CoverageIllusion
        # 착시 >0.10 인 **피처 개수** — MAX 가 아니라 개수다(실측 2026-09-25 20:20).
        #   WHY 개수인가: MAX 는 최악 피처 하나가 값을 지배해 전체 테이블 기준 기준선이
        #   0.9998 이었고, 그러면 문턱을 어디에 둬도 **상시 발화**하거나 **영원히 침묵**한다.
        #   개수는 기준선이 MAX 보다 안정적이지만, **측정 인구**에는 비례한다(R16 실측).
        #   기준선 이동(2026-09-25 21:17): 15 → 36. 악화가 아니라 인구 180 → 199개(R11 2 + R12 19).
        #   문턱은 기준선 **위**(45)에 둔다 → 기존 부채로는 조용하고, **악화되면** 뜬다.
        #   임계값 없이 "정보"로만 두면 새 착시 피처가 늘어도 아무도 모른다.
        expr: dq_feature_coverage_illusion_count > 45
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "커버리지 착시 피처 {{ $value }}개 (기준선 36) — naive 는 값으로 세는데 honest 는 비어 있다"

      - alert: FeatureNullRatioHigh
        # 결측 >0.90 이면서 살아있는 피처 **개수**. 기준선 8(전부 R10 배치) → 문턱 12.
        #   (MAX 형태는 분모가 최악 피처에 지배돼 0.9998 로 상시 발화했다 — 정보용으로 강등.)
        expr: dq_feature_null_ratio_high_count > 12
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "결측 90% 초과 피처 {{ $value }}개 (기준선 8) — '살아있다'고 세지만 사실상 비어 있다"

      - alert: FeatureStockConstantHigh
        # 살아있는데 종목별 값이 1개뿐인 피처 비율. 전체 테이블 기준 실측 0.3391(39/115,
        # 2026-09-25 20:20 — 배치 필터 제거 후)이라 0.50 은 "기존보다 더 나빠졌다"는 뜻이다
        # (상시 오탐 방지). 참고: 배치 필터가 있던 시절의 0.38 은 154개 배치 기준값이었다.
        expr: dq_feature_stock_constant_ratio > 0.50
        for: 1h
        labels:
          severity: critical
        annotations:
          summary: "살아있는 피처 중 종목 상수 비율 {{ $value }} — 룩어헤드 의심(과거 행에 최신 스냅샷)"

      - alert: FeatureMarketLevelMany
        # 날짜 내 분산 0(시장레벨) 피처 수. 2026-09-25 기준선 34개 수준.
        expr: dq_feature_market_level_count > 45
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "날짜 내 분산 0(시장레벨) 피처 {{ $value }}개 — 횡단면 무변별"

      - alert: SupplyPaddingFound
        expr: dq_padding_rows_before_listing > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "상장 전 패딩 행 {{ $value }}개 — 종목 첫 시세일 이전 수급 행"

      - alert: AsofViolationFound
        expr: dq_asof_violation_rows > 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "as-of 위반 {{ $labels.scope }}: {{ $value }}행 (미래/유령 날짜 데이터)"

      - alert: RunnerParseFailure
        # 소스 API 가 행을 줬는데(source>0) 로더가 저장을 0 으로 신고했다 — 진짜 실패.
        # (2026-09-24 실측: output2 를 output 으로 읽어 항상 +0행이었는데 exit 0 이었다.)
        expr: dq_claim_parse_failure == 1
        for: 30m
        labels:
          severity: critical
        annotations:
          summary: "러너 {{ $labels.runner }}: 소스는 행을 줬는데 저장 0 ({{ $labels.table }})"

      # NOTE 1: dq_claim_gap(stored - 신규)은 **알림하지 않는다**. 같은 구간을 재수집하면
      # upsert 로 중복이 걸려 stored>0 / 신규 0 이 정상 발생한다(실측: 저장 44 / 신규 0).
      # 대시보드에서 "중복 재수집" 지표로 사람이 본다.
      # NOTE 2: dq_claim_zero_stored(저장 0 신고)도 알림하지 않는다 — 상장 초기 이력 소진
      # 종목만 남은 실행에서 정상적으로 0이 된다(실측 386380/950260).

      - alert: ColumnAllNull
        # ⚠ 알려진 정상 예외를 뺀다 (실측 2026-09-25 20:10).
        #   ownership.institution_ownership_pct 는 **결측 100% 가 정상**이다 — KIS 현재가 응답
        #   74필드에 기관 지분율이 없어 채울 소스가 존재하지 않는다(R2 조사 결과). 그런데
        #   이 컬럼은 null_ratio=1.0 을 항상 내므로, 문턱 0.99 를 그대로 걸면 **상시 critical**
        #   이 떠서 **진짜 새 all-null 컬럼이 묻힌다**(알림 피로). "기준선이 있는 메트릭은
        #   임계값을 기준선 위에 둔다"의 알림판 — 예외는 (table, column) 쌍으로만 정확히 제외해
        #   다른 테이블/컬럼의 all-null 은 그대로 잡는다.
        expr: dq_col_quality_null_ratio > 0.99
          unless on (table, column) (dq_col_quality_null_ratio{table="ownership", column="institution_ownership_pct"})
        for: 1h
        labels:
          severity: critical
        annotations:
          summary: "컬럼 전량 결측: {{ $labels.table }}.{{ $labels.column }} (수집 실패 의심)"

      - alert: NewsAnalysisStalled
        # 앱은 30분 주기다 → 2시간 넘게 새 저장이 없으면 정지/저장실패를 의심한다.
        # 실측 2026-09-25: url 유니크 제약 누락으로 **2일간 저장이 전멸**(24h 3,657건 폐기)했는데
        # 메트릭이 없어 로그 grep 전엔 아무도 몰랐다. 이 알림이 그 사각지대를 막는다.
        expr: news_analysis_freshness_hours > 2
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "뉴스 분석 저장 정지 의심: {{ $value | printf \"%.1f\" }}시간 무저장"

      - alert: NewsAnalysisSaveFailing
        # 신선도가 오래됐는데 24시간 저장량도 0 → 저장 실패(제약 누락·권한·연결) 확정에 가깝다.
        expr: news_analysis_freshness_hours > 6 and news_analysis_freshness_rows_24h == 0
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "뉴스 분석 저장 전면 실패 의심 (24시간 저장 0행, 마지막 저장 {{ $value | printf \"%.1f\" }}시간 전)"
