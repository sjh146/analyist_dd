target-version = "py312"
line-length = 120
exclude = [
    ".git", ".venv", "venv", "node_modules", "__pycache__",
    "services/*/migrations", "data", "reports", "archive",
]

[lint]
select = [
    "E", "W",
    "F",
    "B",
    "SIM",
    "RET",
    "PIE",
    "RUF",
    "BLE",
    "S",
    "T20",
    "ERA",
    "PLW",
    "ARG",
]
ignore = [
    "E501",
    "S101",
    "S603", "S607",
    "ARG002", "ARG003", "ARG005",
    "RUF001", "RUF002", "RUF003",
    "PLW2901",
]

[lint.per-file-ignores]
"tests/*" = ["S", "T20", "ARG", "BLE"]
"**/test_*.py" = ["S", "T20", "ARG", "BLE"]
"scripts/*" = ["T20"]
"**/__main__.py" = ["T20"]

[lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "fastapi.Depends", "fastapi.Query"]

[lint.isort]
known-first-party = ["app", "kis_app", "trader_core"]

[format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
