[pytest]
addopts = -p no:launch_testing -p no:launch_ros -m "not e2e_live"
markers =
    e2e_live: 실제 스택(PostgreSQL·컨테이너)이 필요하고 오래 걸린다 — 기본 수집 제외, `pytest -m e2e_live` 로 실행
# 중첩 프로젝트(trader-agent)는 자기 테스트를 갖고 있다 — 부모 수집에서 제외한다.
norecursedirs = trader-agent .git .omo data log models reports node_modules
# 루트에서 `pytest` 를 쓰면 두 개의 tests/conftest.py(./tests, ./services/trade-executor/tests)가
# 같은 모듈명 `tests.conftest` 로 잡혀 ImportPathMismatchError 로 **전체 수집이 실패**했다.
# 서비스별 테스트는 각자 자기 디렉토리에서 실행한다(xgboost-ml 은 명시 경로로 잘 돌아간다).
# → 루트 기본 수집은 ./tests 로 한정한다. 서비스 테스트: pytest services/<svc>/tests/ -q
testpaths = tests
# `tests/` 의 여러 모듈이 ML 서비스 패키지(`app.*`)를 import 한다(test_sns_*, test_etl/*,
# test_daytrading_screener_engine, test_champion_promote_live_score_gate …). 각 파일이 제각각
# sys.path 를 만지다 보니 **`app` 이 다른 서비스의 app 패키지로 먼저 잡히면** `No module named
# 'app.training'` 으로 수집이 깨졌다(services/ 12곳에 app/ 가 있다). 정답 패키지를 먼저 고정한다.
pythonpath = . services/xgboost-ml
